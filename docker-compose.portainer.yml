# Hermes Agent — Portainer deployment.
#
# Reconciled against the real upstream docker-compose.yml at
# TKontu/hermes-agent @ 245e48008fa8 (level with NousResearch/hermes-agent main,
# 2026-09-05). Service names, commands and image wiring are upstream's, not
# invented. Authored in a separate private deployment-notes repo and copied
# here; that repo holds the rationale, this file is the deployable artifact.
#
# Deploy as a REPOSITORY stack from the FORK. The image is PULLED, not built:
# Portainer cannot build for a Git-repository stack. Its agent proxies the
# Docker API over HTTP/1.1 while BuildKit needs an HTTP/2 gRPC session, so a
# stack build dies with "failed to list workers: ... http2: frame too large".
# Disabling BuildKit is no escape either -- the Dockerfile uses
# `COPY --link --chmod=`, which the classic builder refuses. So CI builds the
# image and pushes it to GHCR (.github/workflows/deploy-image.yml), and this
# stack just runs it.
#
# Deltas from upstream:
#   1. volume  ~/.hermes -> /opt/hermes   (Portainer runs as root; `~` won't resolve)
#   2. UID/GID default 10000 -> 1001      (the dedicated `hermes` service
#      account, NOT the admin user at uid 1000)
#   3. network_mode: host kept            (reach llama-swap on the LAN without NAT)
#   4. image pulled from GHCR instead of `build: .`
#   5. dashboard commented out for first run
#
# Everything else is upstream verbatim. In particular:
#   - both services run the SAME image; upstream had `gateway` build it and
#     `dashboard` reuse it, which is why dashboard still depends_on gateway.
#   - Do NOT override entrypoint. `/init` is s6-overlay's PID 1 and runs the
#     cont-init.d hooks (chown, profile reconcile, dashboard toggle) that set up
#     the supervision tree. Bypassing it breaks the gateway.
#   - There is deliberately no `env_file:` here. Hermes reads `.env` from its
#     data dir (`/opt/data/.env`, i.e. `/opt/hermes/.env` on the host), so the
#     bind mount already supplies it. A compose-level env_file pointing at a
#     host path would additionally hard-fail the stack when the file is absent.

services:
  gateway:
    # Built and pushed by .github/workflows/deploy-image.yml. Because the tag is
    # `:latest`, Portainer must be told to RE-PULL -- *Update the stack* ->
    # "Re-pull image and redeploy". A plain redeploy reuses the cached image and
    # you will not see your change. Pin a :sha- tag from the Actions run summary
    # if you want reproducible deploys.
    image: ${HERMES_IMAGE:-ghcr.io/tkontu/hermes-agent:latest}
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    volumes:
      # Absolute host path — Portainer runs the stack as root, so `~` would not
      # resolve to your user. All durable state lives here; the container is
      # disposable.
      - /opt/hermes:/opt/data
      # NAS-backed Obsidian vault, as ONE path with a writable hole in it.
      #
      # Two TrueNAS datasets: `hermes` (the vault) and the nested `hermes-edit`.
      # The nested dataset is visible through the parent share, so mounting the
      # writable one OVER the read-only subdirectory gives a single vault path
      # where everything is read-only except hermes-edit/. The obsidian skill
      # then works unmodified against OBSIDIAN_VAULT_PATH=/opt/data/vault, and
      # the agent has no second path to learn.
      #
      # Enforcement is at the NAS, not these flags: hermes-agent has
      # Read|Execute on `hermes` and full rights on `hermes-edit`, so even a
      # leaked credential cannot rewrite the human's notes. The agent holds no
      # credential anyway -- it is root-owned 600 at /etc/hermes-smb.creds on the
      # VM, outside both mounts. See docs/todo-notes.md.
      - /mnt/hermes-vault:/opt/data/vault:ro
      - /mnt/hermes-out:/opt/data/vault/hermes-edit
    environment:
      # s6-overlay remaps the container's internal `hermes` user to these and
      # drops to it, so this decides who the agent RUNS AS and who owns
      # everything under /opt/hermes. 1001 is the dedicated unprivileged
      # service account -- deliberately not 1000, which on a default Ubuntu
      # install is the sudo-capable admin user. Upstream defaults to 10000.
      - HERMES_UID=${HERMES_UID:-1001}
      - HERMES_GID=${HERMES_GID:-1001}
      # API server stays OFF. Enabling it needs BOTH lines, and API_SERVER_KEY
      # is mandatory for auth. Keep it behind an authenticating reverse proxy,
      # never on raw 0.0.0.0.
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
    command: ["gateway", "run"]

  # Bring this up only AFTER the gateway logs verify clean: the resolved
  # provider/base_url, and a context limit at or above 64000 tokens.
  # It stores provider API keys and has NO built-in auth, hence 127.0.0.1 only.
  # Never pass `--insecure --host 0.0.0.0`; tunnel instead:
  #   ssh -L 9119:localhost:9119 <docker-host>
  #
  # dashboard:
  #   image: ${HERMES_IMAGE:-ghcr.io/tkontu/hermes-agent:latest}
  #   container_name: hermes-dashboard
  #   restart: unless-stopped
  #   network_mode: host
  #   depends_on:
  #     - gateway
  #   volumes:
  #     - /opt/hermes:/opt/data
  #   environment:
  #     - HERMES_UID=${HERMES_UID:-1001}
  #     - HERMES_GID=${HERMES_GID:-1001}
  #   command: ["dashboard", "--host", "127.0.0.1", "--no-open"]
